<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rust</title>
  <!-- lerd styles this page like the dashboard; the CSS here is layout only. -->
  <style>
    body { margin: 0; padding: 16px; }
    .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .diag { display: flex; gap: 10px; align-items: flex-start; }
    .diag .lerd-pill { flex: none; min-width: 58px; text-align: center; }
    .diag .body { min-width: 0; flex: 1; }
    .diag .where { margin-top: 2px; overflow-wrap: anywhere; }
    .diag pre { margin: 8px 0 0; padding: 10px; overflow-x: auto; white-space: pre; }
    details summary { cursor: pointer; margin-top: 4px; }
    .card-body { padding: 14px 16px; }
    .card-body p { margin: 6px 0 0; }
    .lerd-tabs { margin: 18px 0 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="empty" class="lerd-empty" hidden><strong></strong><span class="lerd-muted"></span></div>

  <div id="main" hidden>
    <section class="lerd-section">
      <div class="lerd-card"><div class="card-body">
        <div class="head"><strong id="package">Rust</strong><span id="meta" class="lerd-muted"></span></div>
        <div class="pills" id="pills"></div>
        <p id="note" class="lerd-muted" hidden></p>
      </div></div>
    </section>

    <section id="setup" class="lerd-section" hidden>
      <span class="lerd-label">Rebuild on save</span>
      <div class="lerd-card"><div class="card-body">
        <div id="setup-text"></div>
        <p class="lerd-muted">In the project folder: <span class="lerd-mono">lerd rust:setup</span>, then <span class="lerd-mono">lerd link</span> to approve the new dev command.</p>
      </div></div>
    </section>

    <div class="lerd-tabs" role="tablist">
      <button role="tab" id="tab-build" aria-selected="true">Dev server build</button>
      <button role="tab" id="tab-check" aria-selected="false">cargo check</button>
    </div>

    <section id="panel-build">
      <div class="lerd-toolbar"><span id="build-title" class="lerd-muted"></span><span class="spacer"></span><span id="updated" class="lerd-muted"></span></div>
      <div id="build-list"></div>
    </section>

    <section id="panel-check" hidden>
      <div class="lerd-toolbar">
        <button class="primary" id="run-check">Run cargo check</button>
        <span id="check-title" class="lerd-muted"></span>
      </div>
      <div id="check-list"></div>
    </section>
  </div>

  <script src="lerd.js"></script>
  <script src="site.js"></script>
</body>
</html>
